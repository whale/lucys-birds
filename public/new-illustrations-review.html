<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lucy’s Birds — New Illustration Review</title>
  <style>
    :root{color-scheme:light;--paper:#fcfcfb;--ink:#211f1c;--soft:#817a70;--line:#d9d5cd}
    *{box-sizing:border-box}body{margin:0;padding:clamp(24px,5vw,64px);background:var(--paper);color:var(--ink);font-family:Georgia,serif}
    header{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:36px}h1{margin:0;font-size:clamp(30px,5vw,58px);line-height:1}.meta,.pose,.sci{color:var(--soft)}.meta,.pose{font:10px/1.3 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:38px 24px}.species{border-bottom:1px solid var(--line);padding-bottom:18px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.art{min-height:220px;display:grid;grid-template-rows:1fr auto;border-top:1px solid var(--line);padding-top:10px}.art img{width:100%;height:210px;object-fit:contain}.pose{text-align:center;padding-top:8px}.name{display:block;margin-top:14px;font-size:20px}.sci{display:block;font-size:13px;font-style:italic;margin-top:3px}@media(max-width:540px){header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.art{min-height:180px}.art img{height:170px}}
  </style>
</head>
<body>
  <header><div><div class="meta">Lucy’s birds</div><h1>New illustration review</h1></div><div class="meta">9 species · 18 poses</div></header>
  <main class="grid" id="grid"></main>
  <script>
    const birds=[
      ['larus-smithsonianus','American Herring Gull','Larus smithsonianus'],
      ['sterna-paradisaea','Arctic Tern','Sterna paradisaea'],
      ['pica-hudsonia','Black-billed Magpie','Pica hudsonia'],
      ['sitta-pusilla','Brown-headed Nuthatch','Sitta pusilla'],
      ['poecile-carolinensis','Carolina Chickadee','Poecile carolinensis'],
      ['corvus-ossifragus','Fish Crow','Corvus ossifragus'],
      ['setophaga-citrina','Hooded Warbler','Setophaga citrina'],
      ['platalea-ajaja','Roseate Spoonbill','Platalea ajaja'],
      ['setophaga-dominica','Yellow-throated Warbler','Setophaga dominica']
    ];
    document.getElementById('grid').innerHTML=birds.map(([slug,name,sci])=>`<article class="species"><div class="pair"><div class="art"><img src="/illustrations/${slug}.png" alt="${name}, perched"><span class="pose">Perched</span></div><div class="art"><img src="/illustrations/${slug}-2.png" alt="${name}, in flight"><span class="pose">In flight</span></div></div><span class="name">${name}</span><span class="sci">${sci}</span></article>`).join('');
  </script>
</body>
</html>
