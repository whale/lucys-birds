<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fcfcfb" />
    <meta name="pinterest" content="nopin" />
    <meta name="description" content="Welcome to Lucy Smith's website." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lesmith.me/" />
    <meta property="og:title" content="Lucy Smith" />
    <meta property="og:description" content="Welcome to Lucy Smith’s website and bird collection." />
    <meta property="og:image" content="https://lesmith.me/assets/lucy-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Illustration of Lucy holding two bird photographs" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lucy Smith" />
    <meta name="twitter:description" content="Welcome to Lucy Smith’s website and bird collection." />
    <meta name="twitter:image" content="https://lesmith.me/assets/lucy-og.png" />
    <title>Lucy Smith</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://birds.lesmith.me" />
    <link rel="dns-prefetch" href="https://birds.lesmith.me" />
    <link rel="prefetch" href="https://birds.lesmith.me/" as="document" />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="home">
      <div class="portrait-wrap">
        <div
          class="portrait"
          role="img"
          aria-label="Illustration of Lucy holding two bird photographs"
        ></div>
      </div>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Welcome</p>
        <h1 id="page-title">I&rsquo;m Lucy Smith</h1>
        <a class="bird-link" href="https://birds.lesmith.me">
          Check out my bird collection
        </a>
      </section>
    </main>
    <script>
      const collectionLink = document.querySelector(".bird-link");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      collectionLink.addEventListener("click", (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || reduceMotion.matches) return;
        event.preventDefault();
        document.body.classList.add("is-leaving");
        window.setTimeout(() => window.location.assign(collectionLink.href), 150);
      });

      window.addEventListener("pageshow", () => document.body.classList.remove("is-leaving"));
    </script>
  </body>
</html>
